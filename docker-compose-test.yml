version: '3.8'

services:
  # Backend service (Flask API)
  backend:
    image: duongaity/ai-assistant-backend:latest
    container_name: ai-assistant-backend
    ports:
      - "8888:8888"
    # env_file:
    #   - ./backend/application.env
    environment:
      - FLASK_ENV=production
    # volumes:
    #   - ./backend:/app   # Bỏ comment nếu muốn mount code local
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://backend:8888/api/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 60s
    networks:
      - ai-assistant-network

  # Frontend service (React + Vite)
  frontend:
    image: duongaity/ai-assistant-frontend:latest
    container_name: ai-assistant-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://frontend:80"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    networks:
      - ai-assistant-network

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: ai-assistant-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - ai-assistant-network

# Networks
networks:
  ai-assistant-network:
    driver: bridge
    name: ai-assistant-network

# Volumes
volumes:
  backend_data:
    driver: local